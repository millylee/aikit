<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>aikit Web UI</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="login" class="section" style="display:none">
    <h2>aikit Web UI 登录</h2>
    <p class="muted">请输入访问令牌（位于 <code>~/.aikit/daemon.token</code>）</p>
    <div class="row"><input type="password" id="token-input" placeholder="访问令牌" /></div>
    <div class="row"><button class="primary" id="login-btn">连接</button></div>
  </div>

  <div id="app" style="display:none">
    <header>
      <h1>aikit Web UI</h1>
      <span class="meta" id="health-meta"></span>
      <button class="small" id="logout-btn">登出</button>
    </header>
    <main>
      <section id="providers">
        <h2>供应商</h2>
        <ul class="plain" id="provider-list"></ul>
        <div class="divider"></div>
        <button class="small" id="add-provider-btn">+ 新增供应商</button>
      </section>
      <section id="detail">
        <h2 id="detail-title">详情</h2>
        <div id="detail-body"><p class="muted">请选择供应商</p></div>
      </section>
      <section id="side">
        <h2>应用目标</h2>
        <div id="targets-body"></div>
        <div class="divider"></div>
        <div class="row"><button class="primary" id="apply-btn" style="flex:1">应用到目标</button></div>
        <div class="divider"></div>
        <h2>操作</h2>
        <div class="row">
          <button class="small" id="import-btn">导入扫描</button>
          <button class="small" id="updates-btn">检查更新</button>
        </div>
        <div id="import-body"></div>
      </section>
    </main>
    <footer>aikit Web UI · 本地服务</footer>
  </div>
  <div id="modal-root" style="display:none"></div>
  <div id="toasts"></div>

  <script src="/app.js"></script>
</body>
</html>
